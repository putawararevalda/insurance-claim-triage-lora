[project]
name = "lorafinetuning"
version = "0.1.0"
description = "Parameter-Efficient Fine-Tuning (QLoRA) on Small Language Models (SLM) for Indonesian Insurance Claim & FNOL Triage"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "bitsandbytes>=0.44.0",
    "accelerate>=0.34.0",
    "datasets>=3.0.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.0",
    "rich>=13.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
